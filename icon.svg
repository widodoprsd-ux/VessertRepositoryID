<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient utama -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#6E00FF"/>
    </linearGradient>
    
    <!-- Gradient huruf V -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FF"/>
    </linearGradient>
    
    <!-- Gradient aksen -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow untuk huruf -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001133" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#mainGrad)"/>
  
  <!-- Overlay pattern halus -->
  <g opacity="0.12">
    <circle cx="20" cy="20" r="40" fill="#FFFFFF"/>
    <circle cx="110" cy="110" r="30" fill="#FFFFFF"/>
  </g>
  
  <!-- ===== HURUF "V" BESAR (Vessert) ===== -->
  <g filter="url(#dropShadow)">
    <!-- Huruf V -->
    <path d="M30,32 L46,32 L64,86 L82,32 L98,32 L72,102 L56,102 Z" 
          fill="url(#textGrad)" 
          filter="url(#glow)"/>
    
    <!-- Aksen underline di bawah V -->
    <rect x="30" y="106" width="68" height="4" rx="2" fill="url(#accentGrad)"/>
  </g>
  
  <!-- ===== BADGE "ID" (kecil di pojok) ===== -->
  <g transform="translate(84, 12)">
    <!-- Badge background -->
    <rect x="0" y="0" width="34" height="22" rx="6" fill="#FFFFFF" opacity="0.98"/>
    <rect x="0" y="0" width="34" height="22" rx="6" fill="none" 
          stroke="url(#accentGrad)" stroke-width="1.5"/>
    
    <!-- Teks "ID" -->
    <text x="17" y="15.5" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#0066FF" 
          text-anchor="middle"
          letter-spacing="0.5">ID</text>
  </g>
  
  <!-- Dot aksen kecil (detail modern) -->
  <circle cx="118" cy="118" r="4" fill="#00FFD1" opacity="0.9"/>
</svg>
