<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient utama -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#6E00FF"/>
    </linearGradient>
    
    <!-- Gradient aksen -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    
    <!-- Shadow/glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Rounded clip -->
    <clipPath id="rounded">
      <rect x="8" y="8" width="112" height="112" rx="28" ry="28"/>
    </clipPath>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#mainGrad)"/>
  
  <!-- Overlay pattern gelombang halus -->
  <g clip-path="url(#rounded)" opacity="0.15">
    <path d="M0,90 Q32,80 64,90 T128,90 L128,128 L0,128 Z" fill="#FFFFFF"/>
    <path d="M0,100 Q32,90 64,100 T128,100 L128,128 L0,128 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- Ikon Kapal / Vessel -->
  <g filter="url(#glow)">
    <!-- Hull (badan kapal) -->
    <path d="M32,78 L36,92 Q37,96 41,96 L87,96 Q91,96 92,92 L96,78 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Deck line -->
    <rect x="30" y="74" width="68" height="6" rx="2" fill="url(#accentGrad)"/>
    
    <!-- Kabin / Cabin -->
    <rect x="46" y="56" width="36" height="18" rx="2" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Jendela -->
    <rect x="50" y="60" width="6" height="6" rx="1" fill="#0066FF"/>
    <rect x="61" y="60" width="6" height="6" rx="1" fill="#0066FF"/>
    <rect x="72" y="60" width="6" height="6" rx="1" fill="#0066FF"/>
    
    <!-- Cerobong / Funnel -->
    <rect x="58" y="44" width="12" height="14" rx="2" fill="url(#accentGrad)"/>
    <rect x="56" y="42" width="16" height="4" rx="2" fill="#FFFFFF"/>
    
    <!-- Tiang / Mast -->
    <rect x="63" y="30" width="2" height="14" fill="#FFFFFF"/>
    <circle cx="64" cy="28" r="3" fill="url(#accentGrad)"/>
  </g>
  
  <!-- ID Badge (konsep identitas digital) -->
  <g transform="translate(78, 82)">
    <circle cx="18" cy="18" r="16" fill="#FFFFFF" opacity="0.98"/>
    <circle cx="18" cy="18" r="16" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
    
    <!-- Avatar/User icon -->
    <circle cx="18" cy="14" r="4" fill="#0066FF"/>
    <path d="M10,26 Q10,20 18,20 Q26,20 26,26 Z" fill="#0066FF"/>
    
    <!-- Check mark (verified) -->
    <circle cx="27" cy="27" r="6" fill="#00FFD1"/>
    <path d="M24,27 L26.5,29.5 L30,25.5" stroke="#0066FF" stroke-width="1.8" 
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
