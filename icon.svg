<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="modGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#6E00FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#modGrad)"/>
  
  <!-- Tulisan "Vessert" (sans-serif bold) -->
  <text x="64" y="70" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="26" 
        font-weight="800" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="-0.5">Vessert</text>
  
  <!-- Garis aksen -->
  <rect x="42" y="80" width="44" height="3" rx="1.5" fill="url(#accentGrad)"/>
  
  <!-- Label "ID" -->
  <text x="64" y="102" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="12" 
        font-weight="600" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.9">ID</text>
</svg>
