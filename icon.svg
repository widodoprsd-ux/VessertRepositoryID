<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="classicBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A49"/>
      <stop offset="100%" stop-color="#0F1A2E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="100%" stop-color="#8B6F2E"/>
    </linearGradient>
  </defs>
  
  <!-- Background kotak kaku -->
  <rect x="4" y="4" width="120" height="120" rx="4" ry="4" fill="url(#classicBg)"/>
  
  <!-- Border ganda klasik -->
  <rect x="10" y="10" width="108" height="108" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="15" y="15" width="98" height="98" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.6"/>
  
  <!-- V Serif berkaki -->
  <text x="64" y="88" 
        font-family="'Times New Roman', Georgia, serif" 
        font-size="70" font-weight="700" 
        fill="url(#goldGrad)" text-anchor="middle">V</text>
  
  <!-- Ornamen garis klasik -->
  <line x1="30" y1="96" x2="54" y2="96" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="74" y1="96" x2="98" y2="96" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="64" cy="96" r="2.5" fill="url(#goldGrad)"/>
  
  <!-- Tulisan ID serif -->
  <text x="64" y="112" 
        font-family="'Times New Roman', Georgia, serif" 
        font-size="10" font-weight="400" 
        fill="#E8C87A" text-anchor="middle" letter-spacing="4">ID</text>
</svg>
